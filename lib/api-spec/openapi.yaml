openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: outfits
    description: Streetwear outfit analysis and suggestions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /outfits/analyze:
    post:
      operationId: analyzeOutfit
      tags: [outfits]
      summary: Analyze clothing item and generate outfit suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeOutfitBody"
      responses:
        "200":
          description: Outfit suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitSuggestionsResponse"
  /outfits/explore:
    post:
      operationId: exploreOutfits
      tags: [outfits]
      summary: Explore more outfit options based on a selected outfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreOutfitsBody"
      responses:
        "200":
          description: More outfit suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitSuggestionsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeOutfitBody:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image of the clothing item
      required:
        - imageBase64
    ExploreOutfitsBody:
      type: object
      properties:
        itemDescription:
          type: string
          description: Description of the original clothing item
        selectedOutfit:
          $ref: "#/components/schemas/OutfitItem"
      required:
        - itemDescription
        - selectedOutfit
    OutfitItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        style:
          type: string
        items:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        image:
          type: string
          description: Base64 encoded outfit image
      required:
        - id
        - title
        - style
        - items
        - tags
        - image
    OutfitSuggestionsResponse:
      type: object
      properties:
        outfits:
          type: array
          items:
            $ref: "#/components/schemas/OutfitItem"
        itemDescription:
          type: string
      required:
        - outfits
