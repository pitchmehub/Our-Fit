openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: outfits
    description: Streetwear outfit analysis and suggestions
  - name: auth
    description: Authentication operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange mobile authorization code for session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeBody"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeResponse"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Logout mobile session
      responses:
        "200":
          description: Logout success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutMobileSessionResponse"
  /outfits/analyze:
    post:
      operationId: analyzeOutfit
      tags: [outfits]
      summary: Analyze clothing item and generate outfit suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeOutfitBody"
      responses:
        "200":
          description: Outfit suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitSuggestionsResponse"
  /outfits/explore:
    post:
      operationId: exploreOutfits
      tags: [outfits]
      summary: Explore more outfit options based on a selected outfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreOutfitsBody"
      responses:
        "200":
          description: More outfit suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitSuggestionsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - firstName
        - lastName
        - profileImageUrl
    GetCurrentAuthUserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user
    ExchangeMobileAuthorizationCodeBody:
      type: object
      properties:
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
        nonce:
          type: string
          nullable: true
      required:
        - code
        - code_verifier
        - redirect_uri
        - state
    ExchangeMobileAuthorizationCodeResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    LogoutMobileSessionResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AnalyzeOutfitBody:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image of the clothing item
      required:
        - imageBase64
    ExploreOutfitsBody:
      type: object
      properties:
        itemDescription:
          type: string
          description: Description of the original clothing item
        selectedOutfit:
          $ref: "#/components/schemas/OutfitItem"
      required:
        - itemDescription
        - selectedOutfit
    OutfitItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        style:
          type: string
        items:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        image:
          type: string
          description: Base64 encoded outfit image
      required:
        - id
        - title
        - style
        - items
        - tags
        - image
    OutfitSuggestionsResponse:
      type: object
      properties:
        outfits:
          type: array
          items:
            $ref: "#/components/schemas/OutfitItem"
        itemDescription:
          type: string
      required:
        - outfits
